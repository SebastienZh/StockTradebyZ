# ============================================================
# fetch_kline.py 配置文件
# ============================================================

# 默认使用 AKShare，无需 API Key。可选值：akshare、tushare。
# 只有切换为 tushare 时才需要 TUSHARE_TOKEN。
provider: akshare

# AKShare 复权方式：qfq 前复权、hfq 后复权、空字符串不复权。
adjust: qfq
timeout: 20
retry_wait_seconds: 5

# 抓取日期范围（YYYYMMDD 或 'today'）
start: "20190101"
end: "today"

# 股票清单 CSV 路径（需含 ts_code 与 symbol 列）
stocklist: "./pipeline/stocklist.csv"

# 排除板块，可选值：
#   gem  — 创业板（300/301 开头，后缀 .SZ）
#   star — 科创板（688 开头，后缀 .SH）
#   bj   — 北交所（4/8 开头，后缀 .BJ）
# 如需全部保留，设为空列表 []
exclude_boards:
  - gem
  - star
  - bj

# K线数据输出目录
out: "./data/raw"

# 并发下载线程数
# AKShare 的上游是公开网页接口，低并发更稳；遇到限流时可降为 1。
workers: 2
